name: Event pressure source health

on:
  workflow_dispatch:

jobs:
  source-health:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check event pressure source health
        run: npm run event-pressure:source-health
