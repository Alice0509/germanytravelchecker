name: Event pressure promote candidates

on:
  schedule:
    - cron: "47 6 * * 1"
  push:
    branches:
      - main
    paths:
      - src/data/eventPressureCandidates.generated.json
  workflow_dispatch:
    inputs:
      checked_at:
        description: Optional source checked date. Leave empty to use Germany current date.
        required: false
        default: ""
      create_pr:
        description: Create a pull request when generated notes change.
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: event-pressure-promote-candidates
  cancel-in-progress: false

jobs:
  promote-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run promotion automation pipeline
        env:
          CHECKED_AT: ${{ github.event.inputs.checked_at }}
        run: |
          if [ -n "$CHECKED_AT" ]; then
            npm run event-pressure:auto-pipeline:promote:write -- --checked-at="$CHECKED_AT"
          else
            npm run event-pressure:auto-pipeline:promote:write
          fi

      - name: Append copy safety review to promotion report
        run: npm run event-pressure:copy-safety:report:promotion -- --append-to=event-pressure-promotion-report.md

      - name: Append source trust review to promotion report
        run: npm run event-pressure:source-trust:report:promotion -- --append-to=event-pressure-promotion-report.md

      - name: Check promotion automation outputs
        run: npm run event-pressure:outputs:promotion

      - name: Build site
        run: npm run build

      - name: Show promotion diff
        run: |
          git --no-pager diff -- src/data/eventPressureNotes.generated.json src/data/eventPressureCandidates.generated.json
          git --no-pager diff --stat

      - name: Create generated notes pull request
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.create_pr == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/eventPressureNotes.generated.json src/data/eventPressureCandidates.generated.json; then
            echo "No promoted candidate changes to open as a pull request."
            exit 0
          fi

          BRANCH="automation/event-pressure-promoted-notes"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/eventPressureNotes.generated.json src/data/eventPressureCandidates.generated.json
          git commit -m "Promote event pressure candidates"
          git push --force-with-lease origin "$BRANCH"

          EXISTING_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTING_PR" ]; then
            echo "Promotion PR already open: #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" --body-file event-pressure-promotion-report.md
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: promote event pressure candidates" \
              --body-file event-pressure-promotion-report.md
          fi

      - name: Upload generated notes file
        uses: actions/upload-artifact@v4
        with:
          name: event-pressure-notes-generated
          path: src/data/eventPressureNotes.generated.json

      - name: Upload remaining candidates file
        uses: actions/upload-artifact@v4
        with:
          name: event-pressure-candidates-generated
          path: src/data/eventPressureCandidates.generated.json

      - name: Upload promotion review report
        uses: actions/upload-artifact@v4
        with:
          name: event-pressure-promotion-pr-review
          path: event-pressure-promotion-report.md
