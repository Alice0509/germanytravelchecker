name: Event pressure check

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - scripts/**
      - src/data/eventPressure*.json
      - src/utils/eventPressureNotes.js
      - src/utils/tripDatesResult.js
      - src/utils/multiCityTripResult.js
      - src/components/EventPressureBanner.jsx
      - src/components/CurrentTravelSignals.jsx
      - src/components/CheckToday.jsx
      - .github/workflows/event-pressure-*.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - scripts/**
      - src/data/eventPressure*.json
      - src/utils/eventPressureNotes.js
      - src/utils/tripDatesResult.js
      - src/utils/multiCityTripResult.js
      - src/components/EventPressureBanner.jsx
      - src/components/CurrentTravelSignals.jsx
      - src/components/CheckToday.jsx
      - .github/workflows/event-pressure-*.yml

jobs:
  event-pressure-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run event pressure automation check
        run: npm run event-pressure:automation-check

      - name: Build site
        run: npm run build
