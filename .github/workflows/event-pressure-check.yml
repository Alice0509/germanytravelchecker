name: Event pressure check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

jobs:
  event-pressure-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report event pressure coverage
        run: npm run event-pressure:report

      - name: Check expired event pressure notes
        run: npm run event-pressure:expired:strict

      - name: Check known event dates
        run: npm run event-pressure:known-dates:strict

      - name: Scan known event sources
        run: npm run event-pressure:scan-known-sources


      - name: Seed event pressure candidates
        run: npm run event-pressure:seed-candidates

      - name: Validate event pressure candidates
        run: npm run event-pressure:candidates

      - name: Validate event pressure data
        run: npm run event-pressure:discover

      - name: Build site
        run: npm run build
