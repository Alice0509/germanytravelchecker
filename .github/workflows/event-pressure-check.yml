name: Event pressure check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

jobs:
  event-pressure-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report event pressure coverage
        run: npm run event-pressure:report

      - name: Validate event pressure data
        run: npm run event-pressure:discover

      - name: Build site
        run: npm run build
