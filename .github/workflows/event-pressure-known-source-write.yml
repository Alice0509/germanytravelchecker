name: Event pressure known source write scan

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: Optional scan limit for testing. Leave empty to scan all known event seeds.
        required: false
        default: ""
      create_pr:
        description: Create a pull request when candidate JSON changes.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: event-pressure-known-source-write
  cancel-in-progress: false

jobs:
  scan-known-sources-write:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run candidate automation pipeline
        env:
          SCAN_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "$SCAN_LIMIT" ]; then
            npm run event-pressure:auto-pipeline:candidates:write -- --limit="$SCAN_LIMIT"
          else
            npm run event-pressure:auto-pipeline:candidates:write
          fi

      - name: Check candidate automation outputs
        run: npm run event-pressure:outputs:candidate

      - name: Build site
        run: npm run build

      - name: Show candidate diff
        run: |
          git --no-pager diff -- src/data/eventPressureCandidates.generated.json
          git --no-pager diff --stat

      - name: Create candidate pull request
        if: ${{ github.event_name == 'schedule' || github.event.inputs.create_pr == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/eventPressureCandidates.generated.json; then
            echo "No candidate changes to open as a pull request."
            exit 0
          fi

          BRANCH="automation/event-pressure-candidates"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/eventPressureCandidates.generated.json
          git commit -m "Update event pressure candidates from source scan"
          git push --force-with-lease origin "$BRANCH"

          EXISTING_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTING_PR" ]; then
            echo "Candidate PR already open: #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" --body-file event-pressure-candidate-report.md
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update event pressure candidates from source scan" \
              --body-file event-pressure-candidate-report.md
          fi

      - name: Upload candidate file
        uses: actions/upload-artifact@v4
        with:
          name: event-pressure-candidates-generated
          path: src/data/eventPressureCandidates.generated.json

      - name: Upload candidate review report
        uses: actions/upload-artifact@v4
        with:
          name: event-pressure-candidate-review
          path: event-pressure-candidate-report.md
