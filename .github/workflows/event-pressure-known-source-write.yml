name: Event pressure known source write scan

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Optional scan limit for testing. Leave empty to scan all known event seeds.
        required: false
        default: ""
      create_pr:
        description: Create a pull request when candidate JSON changes.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-known-sources-write:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run known source scanner in write mode
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            npm run event-pressure:scan-known-sources -- --write --limit=${{ github.event.inputs.limit }}
          else
            npm run event-pressure:scan-known-sources -- --write
          fi

      - name: Validate candidates
        run: npm run event-pressure:candidates

      - name: Report event pressure coverage
        run: npm run event-pressure:report

      - name: Write candidate review report
        run: npm run event-pressure:candidate-report:markdown

      - name: Check generated notes expiry
        run: npm run event-pressure:expired:strict

      - name: Check known event dates
        run: npm run event-pressure:known-dates:strict

      - name: Build site
        run: npm run build

      - name: Show candidate diff
        run: |
          git --no-pager diff -- src/data/eventPressureCandidates.generated.json
          git --no-pager diff --stat

      - name: Create candidate pull request
        if: ${{ github.event.inputs.create_pr == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/eventPressureCandidates.generated.json; then
            echo "No candidate changes to open as a pull request."
            exit 0
          fi

          BRANCH="automation/event-pressure-candidates-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/eventPressureCandidates.generated.json
          git commit -m "Update event pressure candidates from source scan"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update event pressure candidates from source scan" \
            --body-file event-pressure-candidate-report.md

      - name: Upload candidate file
        uses: actions/upload-artifact@v4
        with:
          name: event-pressure-candidates-generated
          path: src/data/eventPressureCandidates.generated.json

      - name: Upload candidate review report
        uses: actions/upload-artifact@v4
        with:
          name: event-pressure-candidate-review
          path: event-pressure-candidate-report.md

